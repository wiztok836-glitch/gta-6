<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA6 — Registration | Deluxe Edition Access</title>
    <meta name="description" content="Register for GTA6 Deluxe Edition access. Limited availability.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --luxury-pink: #e0115f;
            --luxury-orange: #ff6b35;
            --navy: #0a1628;
            --font-display: 'Bebas Neue', sans-serif;
            --font-body: 'Montserrat', sans-serif;
            --font-serif: 'Playfair Display', serif;
        }

        body {
            font-family: var(--font-body);
            min-height: 100vh;
            background: url('email.jpg') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(10, 22, 40, 0.85);
            backdrop-filter: blur(10px);
        }

        .register-container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 480px;
            padding: 3.5rem;
            background: rgba(17, 17, 24, 0.95);
            border: 1px solid rgba(224, 17, 95, 0.3);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.8);
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-mark {
            width: 60px;
            height: 60px;
            margin: 0 auto 1rem;
            background: linear-gradient(135deg, var(--luxury-pink), var(--luxury-orange));
            color: #fff;
            font-family: var(--font-display);
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .logo {
            font-family: var(--font-display);
            font-size: 3.5rem;
            color: #fff;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .logo span {
            color: var(--luxury-pink);
        }

        .tagline {
            font-family: var(--font-serif);
            font-style: italic;
            color: var(--luxury-orange);
            font-size: 1rem;
            margin-bottom: 2.5rem;
            letter-spacing: 0.05em;
            text-align: center;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-family: var(--font-body);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 0.5rem;
        }

        .input-group input {
            width: 100%;
            padding: 1rem 1.2rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1rem;
            font-family: var(--font-body);
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--luxury-pink);
            background: rgba(224, 17, 95, 0.05);
        }

        .luxury-btn {
            width: 100%;
            padding: 1.2rem;
            margin-top: 1rem;
            background: linear-gradient(135deg, var(--luxury-pink), var(--luxury-orange));
            border: none;
            color: #fff;
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .luxury-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(224, 17, 95, 0.4);
        }

        .luxury-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .secure-note {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.1em;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        @media (max-width: 480px) {
            .register-container { padding: 2.5rem 1.5rem; }
            .logo { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="register-container">
        <div class="logo-mark">🌇</div>
        <div class="logo">GTA<span>VI</span></div>
        <div class="tagline">The Next Generation Open-World Experience</div>
        
        <form id="register-form" action="loading.html" method="GET">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="reg-username" name="username" placeholder="Enter your name" required autocomplete="off">
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="reg-email" name="email" placeholder="your@email.com" required autocomplete="off">
            </div>
            <button type="submit" class="luxury-btn" id="register-btn">
                ACCESS EVENT
            </button>
        </form>
        <div class="secure-note">
            <span></span> Secure SSL Encryption
        </div>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', function(e) {
            const btn = document.getElementById('register-btn');
            btn.disabled = true;
            btn.textContent = 'Processing...';
            
            // Store user data
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            localStorage.setItem('tech9_user', JSON.stringify({username, email}));
            
            // Allow form to proceed to loading.html
        });
    </script>

</body>
</html>
