<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTAVI — Registration | Deluxe Edition Access</title>
    <meta name="description" content="Register for GTAVI Deluxe Edition access. Limited availability.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --luxury-pink: #e0115f;
            --luxury-orange: #ff6b35;
            --navy: #0a1628;
            --font-display: 'Bebas Neue', sans-serif;
            --font-body: 'Montserrat', sans-serif;
            --font-serif: 'Playfair Display', serif;
        }

        body {
            font-family: var(--font-body);
            min-height: 100vh;
            background: url('email.jpg') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(10, 22, 40, 0.80);
            backdrop-filter: blur(8px);
        }

        .register-container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 520px;
            padding: 4rem;
            background: linear-gradient(135deg, rgba(17, 17, 24, 0.98) 0%, rgba(26, 42, 66, 0.5) 100%);
            border: 2px solid rgba(224, 17, 95, 0.35);
            box-shadow: 
                0 30px 100px rgba(0, 0, 0, 0.7),
                0 0 80px rgba(224, 17, 95, 0.15),
                inset 0 0 40px rgba(224, 17, 95, 0.03);
            animation: slideUp 0.6s ease;
            backdrop-filter: blur(15px);
            border-radius: 8px;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 3rem;
        }

        .premium-logo {
            font-family: var(--font-display);
            font-size: 5rem;
            color: #fff;
            letter-spacing: 0.12em;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 30px rgba(224, 17, 95, 0.4);
            font-weight: 700;
        }

        .premium-logo span {
            color: var(--luxury-pink);
            text-shadow: 0 0 40px rgba(224, 17, 95, 0.6);
        }

        .logo-badge {
            display: inline-block;
            padding: 0.7rem 2rem;
            background: rgba(224, 17, 95, 0.15);
            border: 1px solid rgba(224, 17, 95, 0.4);
            color: var(--luxury-orange);
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            font-weight: 700;
            border-radius: 2px;
        }

        .tagline {
            font-family: var(--font-serif);
            color: rgba(255, 255, 255, 0.85);
            font-size: 1rem;
            margin-bottom: 2.5rem;
            letter-spacing: 0.05em;
            text-align: center;
            line-height: 1.6;
            font-weight: 500;
        }

        .input-group {
            margin-bottom: 1.8rem;
        }

        .input-group label {
            display: block;
            font-family: var(--font-body);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.55);
            margin-bottom: 0.7rem;
        }

        .input-group input {
            width: 100%;
            padding: 1.1rem 1.3rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(224, 17, 95, 0.2);
            color: #fff;
            font-size: 1rem;
            font-family: var(--font-body);
            transition: all 0.3s ease;
            outline: none;
            border-radius: 2px;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .input-group input:focus {
            border-color: var(--luxury-pink);
            background: rgba(224, 17, 95, 0.08);
            box-shadow: 0 0 15px rgba(224, 17, 95, 0.15);
        }

        .luxury-btn {
            width: 100%;
            padding: 1.3rem;
            margin-top: 1.5rem;
            background: linear-gradient(135deg, var(--luxury-pink), var(--luxury-orange));
            border: none;
            color: #fff;
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(224, 17, 95, 0.25);
            border-radius: 2px;
        }

        .luxury-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 20px 50px rgba(224, 17, 95, 0.4);
        }

        .luxury-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .secure-note {
            margin-top: 1.8rem;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 0.1em;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        @media (max-width: 480px) {
            .register-container { 
                padding: 2.5rem 1.5rem;
                max-width: 95%;
            }
            .premium-logo { font-size: 3.5rem; }
        }
    </style>
</head>
<body>

    <div class="register-container">
        <div class="logo-section">
            <div class="logo-badge">EXCLUSIVE ACCESS</div>
            <div class="premium-logo">GTA<span>VI</span></div>
        </div>
        <div class="tagline">Get instant access to the Deluxe Edition and experience the next generation of gaming</div>
        
        <form id="register-form" action="loading.html" method="GET">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="reg-username" name="username" placeholder="Enter your name" required autocomplete="off">
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="reg-email" name="email" placeholder="your@email.com" required autocomplete="off">
            </div>
            <button type="submit" class="luxury-btn" id="register-btn">
                CLAIM ACCESS
            </button>
        </form>
        <div class="secure-note">
            🔒 Secure & Encrypted
        </div>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', function(e) {
            const btn = document.getElementById('register-btn');
            btn.disabled = true;
            btn.textContent = 'Processing...';
            
            // Store user data
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            localStorage.setItem('tech9_user', JSON.stringify({username, email}));
            
            // Allow form to proceed to loading.html
        });
    </script>

</body>
</html>
